<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PartySphere - Real-time Globe Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }
        .glow-text {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }
        .glow-box {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        .pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <div id="vanta-globe" class="fixed top-0 left-0 w-full h-full z-0"></div>
    
    <div class="relative z-10 min-h-screen flex flex-col">
        <!-- Header -->
        <header class="py-6 px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i data-feather="globe" class="text-purple-400"></i>
                    <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600">PartySphere</span>
                </div>
                <nav class="hidden md:flex space-x-8">
                    <a href="#" class="hover:text-purple-300 transition">Home</a>
                    <a href="#" class="hover:text-purple-300 transition">Features</a>
                    <a href="#" class="hover:text-purple-300 transition">About</a>
                    <a href="#" class="hover:text-purple-300 transition">Contact</a>
                </nav>
                <button class="md:hidden">
                    <i data-feather="menu" class="text-white"></i>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow flex flex-col items-center justify-center px-4 sm:px-6 lg:px-8 text-center">
            <div class="max-w-4xl mx-auto">
                <h1 class="text-4xl sm:text-5xl md:text-6xl font-bold mb-6 glow-text">
                    Where's everyone at?
                </h1>
                <p class="text-xl sm:text-2xl text-gray-300 mb-12 max-w-2xl mx-auto">
                    Track real-time connections across the globe with our interactive visualization.
                </p>
                
                <div class="bg-gray-800 bg-opacity-50 backdrop-blur-md rounded-xl p-8 mb-12 glow-box">
                    <div class="flex flex-col sm:flex-row justify-center items-center space-y-4 sm:space-y-0 sm:space-x-8">
                        <div class="flex items-center space-x-2">
                            <div class="w-3 h-3 rounded-full bg-purple-500 animate-pulse"></div>
                            <span class="text-lg">Active Connections</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <div class="w-3 h-3 rounded-full bg-pink-500 animate-pulse"></div>
                            <span class="text-lg">New Users</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <div class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></div>
                            <span class="text-lg">Peak Hours</span>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row justify-center space-y-4 sm:space-y-0 sm:space-x-6">
                    <button class="btn-hover bg-gradient-to-r from-purple-500 to-pink-600 text-white font-semibold py-3 px-8 rounded-full transition-all duration-300 transform hover:scale-105 pulse">
                        Explore Live Data
                    </button>
                    <button class="btn-hover bg-gray-800 bg-opacity-70 text-white font-semibold py-3 px-8 rounded-full border border-purple-400 transition-all duration-300 transform hover:scale-105">
                        How It Works
                    </button>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="py-8 px-4 sm:px-6 lg:px-8 text-center text-gray-400 text-sm">
            <div class="max-w-4xl mx-auto">
                <p class="mb-4">
                    Powered by <a href="https://cobe.vercel.app/" class="text-purple-300 hover:text-purple-200">🌏 Cobe</a>, 
                    <a href="https://www.npmjs.com/package/phenomenon" class="text-purple-300 hover:text-purple-200">Phenomenon</a> and 
                    <a href="https://npmjs.com/package/partyserver/" class="text-purple-300 hover:text-purple-200">🎈 PartyServer</a>
                </p>
                <p>© 2023 PartySphere. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <script>
        // Initialize Vanta.js globe
        VANTA.GLOBE({
            el: "#vanta-globe",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x7f3bff,
            backgroundColor: 0x111827,
            size: 0.8,
            points: 10.00
        });

        // Feather icons
        feather.replace();

        // Animation for buttons
        document.querySelectorAll('.btn-hover').forEach(button => {
            button.addEventListener('mouseenter', () => {
                anime({
                    targets: button,
                    scale: 1.05,
                    duration: 200
                });
            });
            button.addEventListener('mouseleave', () => {
                anime({
                    targets: button,
                    scale: 1,
                    duration: 200
                });
            });
        });
    </script>
</body>
</html>
