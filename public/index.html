<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MasterPlan Vision</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #0a0a0a;
            --gold: #c9a84c;
            --gold-light: #e8c97a;
            --cream: #f5f0e8;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(201, 168, 76, 0.2);
        }

        html,
        body {
            height: 100%;
            background: var(--black);
            color: var(--white);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        /* Ambient background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 20% 80%, rgba(201, 168, 76, 0.07) 0%, transparent 70%),
                radial-gradient(ellipse 40% 60% at 80% 20%, rgba(201, 168, 76, 0.05) 0%, transparent 70%),
                radial-gradient(ellipse 80% 40% at 50% 50%, rgba(20, 15, 5, 0.8) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* Grain overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            gap: 0;
        }

        /* Decorative top line */
        .top-rule {
            width: 1px;
            height: 60px;
            background: linear-gradient(to bottom, transparent, var(--gold));
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeDown 1s ease 0.2s forwards;
        }

        .tagline-top {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            font-weight: 400;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--gold);
            opacity: 0;
            animation: fadeUp 1s ease 0.5s forwards;
            margin-bottom: 1.2rem;
        }

        .logo-wrap {
            opacity: 0;
            animation: fadeUp 1s ease 0.7s forwards;
            margin-bottom: 0.6rem;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.6rem, 8vw, 5rem);
            font-weight: 300;
            letter-spacing: 0.05em;
            line-height: 1;
            text-align: center;
            background: linear-gradient(135deg, var(--cream) 0%, var(--gold-light) 50%, var(--cream) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h1 span {
            display: block;
            font-weight: 600;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.8rem 0;
            opacity: 0;
            animation: fadeUp 1s ease 0.9s forwards;
        }

        .divider-line {
            width: 60px;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--gold-light));
        }

        .divider-line.right {
            background: linear-gradient(to left, transparent, var(--gold-light));
        }

        .divider-diamond {
            width: 5px;
            height: 5px;
            background: var(--gold);
            transform: rotate(45deg);
        }

        .fill-cup {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(0.8rem, 2.5vw, 1rem);
            font-weight: 300;
            font-style: italic;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.45);
            opacity: 0;
            animation: fadeUp 1s ease 1s forwards;
            margin-bottom: 3rem;
        }

        /* Buttons */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-width: 320px;
            opacity: 0;
            animation: fadeUp 1s ease 1.2s forwards;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            backdrop-filter: blur(12px);
            color: var(--white);
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(201, 168, 76, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .btn:hover::before {
            opacity: 1;
        }

        .btn:hover {
            border-color: rgba(201, 168, 76, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(201, 168, 76, 0.1);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-icon {
            width: 18px;
            height: 18px;
            fill: var(--gold-light);
            flex-shrink: 0;
        }

        .btn-primary {
            border-color: rgba(201, 168, 76, 0.35);
            background: rgba(201, 168, 76, 0.06);
        }

        /* Bottom rule */
        .bottom-rule {
            width: 1px;
            height: 60px;
            background: linear-gradient(to top, transparent, var(--gold));
            margin-top: 2.5rem;
            opacity: 0;
            animation: fadeUp 1s ease 1.4s forwards;
        }

        /* Auto-redirect notice */
        .auto-note {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.55rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.2);
            opacity: 0;
            animation: fadeUp 1s ease 1.6s forwards;
            white-space: nowrap;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Progress bar for auto-redirect */
        .progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--gold), transparent);
            width: 0%;
            transition: width linear;
        }

        .progress-bar.active {
            width: 100%;
            transition: width 3s linear;
        }
    </style>
</head>

<body>

    <div class="progress-bar" id="progressBar"></div>

    <div class="container">
        <div class="top-rule"></div>

        <p class="tagline-top">Your journey begins here</p>

        <div class="logo-wrap">
            <h1>MasterPlan<span>Vision</span></h1>
        </div>

        <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-diamond"></div>
            <div class="divider-line right"></div>
        </div>

        <p class="fill-cup">Fill Your Cup First</p>

        <div class="buttons">
            <a class="btn btn-primary" href="https://apps.apple.com/app/id6758057883" id="iosBtn">
                <svg class="btn-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z" />
                </svg>
                Download on App Store
            </a>

            <a class="btn" href="https://play.google.com/store/apps/details?id=com.masterplanvision.app"
                id="androidBtn">
                <svg class="btn-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M3.18 23.76c.3.17.64.22.98.15l.11-.07 9.35-9.35-2.12-2.12-8.32 11.39zM20.54 10.23l-2.62-1.51-2.37 2.37 2.37 2.37 2.64-1.53c.75-.43.75-1.27-.02-1.7zM2.18.3C1.9.52 1.73.88 1.73 1.36v21.3c0 .48.17.84.46 1.06l.06.04 11.93-11.93v-.28L2.18.3zm14.62 8.43l-2.12 2.12 2.12 2.12 2.12-2.12-2.12-2.12z" />
                </svg>
                Get it on Google Play
            </a>
        </div>

        <div class="bottom-rule"></div>
    </div>

    <p class="auto-note" id="autoNote"></p>

    <script>
        const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
        const android = /android/i.test(navigator.userAgent);

        const iosUrl = 'https://apps.apple.com/app/id6758057883';
        const androidUrl = 'https://play.google.com/store/apps/details?id=com.masterplanvision.mobile';

        const note = document.getElementById('autoNote');
        const bar = document.getElementById('progressBar');

        if (ios || android) {
            const url = ios ? iosUrl : androidUrl;
            const store = ios ? 'App Store' : 'Google Play';
            note.textContent = `Redirecting you to ${store}…`;

            // Animate progress bar
            setTimeout(() => { bar.classList.add('active'); }, 100);

            // Redirect after 3s
            setTimeout(() => { window.location.href = url; }, 3000);
        } else {
            note.textContent = 'Available on iOS & Android';
        }
    </script>
</body>

</html>
